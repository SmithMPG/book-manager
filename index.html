<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="components/theme.css" />
    <link rel="stylesheet" href="components/toolbar.css" />
    <link rel="stylesheet" href="components/home-hero.css" />
    <link rel="stylesheet" href="components/stat-list.css" />
    <style>
      :root {
        --navy: #0f1729;
        --navy-light: #172234;
        --navy-lighter: #1e2a3f;
        --gold: #d4af37;
        --gold-soft: #e8c766;
        --text: #e8e8ea;
        --text-dim: #9aa3b2;
        --border: #2a3549;
        --green: #3ecf8e;
        --blue: #3b82f6;
        --red: #e85c5c;
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #e5e5e5;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      /* ===== Page ===== */
      .page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 28px 110px; /* room under the last row for a floating + */
      }

      /* Floating "+" in the bottom-right corner (a new prospect or client,
         Add product, Add FA). It
         sits inside its tab, so it only shows while that tab is open. */
      .fab {
        position: fixed;
        right: 32px;
        bottom: 32px;
        z-index: 50;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: var(--gold);
        color: var(--navy);
        font-size: 28px;
        font-weight: 600;
        font-family: inherit;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(15, 23, 41, 0.28);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .fab:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(15, 23, 41, 0.32);
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="components/supabase-client.js"></script>
    <script src="components/money.js"></script>
    <script src="components/app-mode.js"></script>
    <script src="components/auth.js"></script>
    <script src="constants.js"></script>
    <script src="components/month-bar.js"></script>
    <script src="components/pcr-meter.js"></script>
    <script src="components/week-rings.js"></script>
    <script src="components/client-funnel.js"></script>
    <script src="components/monthly-stats.js"></script>
    <script src="components/client-card.js"></script>
    <script src="components/status-input.js"></script>
    <script src="components/card-items.js"></script>
    <script src="components/choice-dialog.js"></script>
    <script src="components/commission-calculator.js"></script>
    <script src="components/review.js"></script>
    <script src="components/leaderboard.js"></script>
    <script src="components/data.js"></script>
    <script src="components/team.js"></script>
    <script src="components/products.js"></script>
    <script src="components/pipeline.js"></script>
    <script src="components/calendar.js"></script>
    <script src="components/new-client.js"></script>
    <script src="components/client-search.js"></script>

    <!-- ===== Top bar ===== -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="shield"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
          <span class="brand-name">Book<span class="brand-gold">Manager</span></span>
        </div>
        <div class="mode-toggle hidden" id="mode-toggle" title="Admins only: your own book, the whole team, or the Test Book">
          <button type="button" data-mode="fa">My book</button>
          <button type="button" data-mode="admin">Admin</button>
          <button type="button" data-mode="test">Test</button>
        </div>
      </div>
      <div class="topbar-center">
        <button class="cc-trigger" id="commission-calc-trigger" title="Commission Calculator">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
        </button>
        <div class="search-wrap">
          <span class="search-icon">&#8981;</span>
          <input class="search-input" type="search" placeholder="Search clients&hellip;" />
        </div>
        <button class="cc-trigger" id="checkout-trigger" title="Review">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <path d="m9 14 2 2 4-4" />
          </svg>
        </button>
      </div>
      <div class="topbar-right">
        <button class="profile-btn"></button>
        <span class="advisor-name"></span>
        <button class="btn-signout">Sign out</button>
      </div>
    </div>

    <div class="no-month-strip" id="no-month-strip" hidden>No close-off date for this month yet — set it under ☰ → Calendar.</div>
    <div class="test-mode-strip">Test mode — you're in the Test Book. Nothing here counts on the leaderboard or team figures.</div>

    <!-- ===== Tab bar ===== -->
    <div class="tab-bar">
      <div class="tab tab-icon active" data-tab="dashboard" title="Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7" />
          <path d="M4 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10" />
        </svg>
        <span class="admin-only">Home</span>
      </div>
      <div class="tab fa-only" data-tab="prospects">Prospects <span class="tab-count">0</span></div>
      <div class="tab fa-only" data-tab="business">Open Cases <span class="tab-count">0</span></div>
      <div class="tab fa-only" data-tab="clients">Clients <span class="tab-count">0</span></div>
      <div class="tab tab-icon fa-only" data-tab="not-moved" title="Not Moved Forward">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
        </svg>
        <span class="tab-count">0</span>
      </div>
      <!-- Admin mode: Home and the pipeline (pipeline.js), the same width;
           then a menu for Case types (products.js), Financial Advisers
           (team.js) and the Calendar (calendar.js). The menu's tab shows as active on either page. -->
      <div class="tab admin-only" data-tab="open">Open cases <span class="tab-count">0</span></div>
      <div class="tab admin-only" data-tab="submitted">Submitted cases <span class="tab-count">0</span></div>
      <div class="tab tab-icon admin-only tab-menu" data-menu="products team calendar" title="Case types, Financial Advisers and Calendar">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="6" x2="20" y2="6" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="18" x2="20" y2="18" />
        </svg>
        <div class="tab-menu-list">
          <button type="button" data-menu-tab="products">Case types</button>
          <button type="button" data-menu-tab="team">Financial Advisers</button>
          <button type="button" data-menu-tab="calendar">Calendar</button>
        </div>
      </div>
    </div>

    <!-- Month progress bar (full width, only shown on the Home tab) -->
    <div class="month-bar-wrapper tab-content active" id="month-bar-wrapper">
      <div id="month-bar-container"></div>
    </div>

    <!-- Home hero: funnel, PCR meter (this cycle's hero, dead center), monthly stats.
       Full width like the month bar, only shown on the Home tab. -->
    <div class="home-hero-wrapper tab-content active" id="home-hero-wrapper">
      <div class="home-hero">
        <div class="hero-col hero-col-funnel">
          <div id="client-funnel-container"></div>
        </div>
        <div class="hero-center">
          <div id="pcr-meter-container"></div>
          <div id="week-rings-container" hidden></div>
        </div>
        <div class="hero-col hero-col-monthly">
          <div id="monthly-stats-container"></div>
        </div>
      </div>
    </div>

    <div class="page">
      <!-- ===== DASHBOARD TAB ===== -->
      <div class="tab-content active" id="tab-dashboard">
        <!-- Leaderboard -->
        <div id="leaderboard-container"></div>
      </div>

      <!-- ===== PROSPECTS TAB ===== -->
      <div class="tab-content" id="tab-prospects">
        <div id="prospects-cards"></div>
        <button type="button" class="fab btn-new-client" data-tab="prospects" title="Add a prospect" aria-label="Add a prospect">+</button>
      </div>

      <!-- ===== BUSINESS TAB ===== -->
      <div class="tab-content" id="tab-business">
        <div id="business-cards"></div>
      </div>

      <!-- ===== CLIENTS TAB ===== -->
      <div class="tab-content" id="tab-clients">
        <div id="clients-cards"></div>
        <button type="button" class="fab btn-new-client" data-tab="clients" title="Add a client" aria-label="Add a client">+</button>
      </div>

      <!-- ===== NOT MOVED FORWARD TAB ===== -->
      <div class="tab-content" id="tab-not-moved">
        <div id="not-moved-cards"></div>
      </div>

      <!-- ===== ADMIN: FA LIST ===== -->
      <div class="tab-content" id="tab-team">
        <div class="fa-views">
          <button type="button" class="fa-view active" data-fa-view="active">Active <span class="tab-count">0</span></button>
          <button type="button" class="fa-view" data-fa-view="left">Left <span class="tab-count">0</span></button>
        </div>
        <div id="team-cards"></div>
        <div id="left-cards" hidden></div>
        <button type="button" class="fab btn-add-fa" title="Add an FA" aria-label="Add an FA">+</button>
      </div>

      <!-- ===== ADMIN: PIPELINE (pipeline.js) ===== -->
      <div class="tab-content" id="tab-open">
        <div id="open-pipeline"></div>
      </div>
      <div class="tab-content" id="tab-submitted">
        <div id="submitted-pipeline"></div>
      </div>

      <!-- ===== ADMIN: CALENDAR (calendar.js) ===== -->
      <div class="tab-content" id="tab-calendar">
        <div id="calendar-months"></div>
      </div>

      <!-- ===== ADMIN: CASE TYPES (products.js — called products in the code) ===== -->
      <div class="tab-content" id="tab-products">
        <div id="products-cards"></div>
        <button type="button" class="fab btn-add-product" title="Add a case type" aria-label="Add a case type">+</button>
      </div>
    </div>

    <script>
      initAuth();
      const pcrMeter = initPcrMeter("pcr-meter-container", { periodLabel: getCurrentPeriodLabel() });
      initMonthBar("month-bar-container", {
        onNavigate: (period) => pcrMeter.setPeriodLabel(dashboardLabel(period)),
        onPeriodChange: onDashboardPeriodChange,
      });
      const funnel = initClientFunnel("client-funnel-container");
      const monthlyStats = initMonthlyStats("monthly-stats-container");
      const weekRings = initWeekRings("week-rings-container");
      initClientCards(document);
      initCardItems(document);
      initCommissionCalculator("commission-calc-trigger");
      initReview("checkout-trigger");
      const leaderboard = initLeaderboard("leaderboard-container");
      initNewClient(".btn-new-client");
      initClientSearch(".search-input");
      initTeam(document);
      initProducts(document);
      initPipeline(document);
      initCalendar(document);

      // Cards and dashboard numbers load from Supabase once someone's
      // signed in (data.js, on 'currentuser:changed').
      registerDashboardWidgets({ pcrMeter, funnel, monthlyStats, leaderboard, weekRings });

      // Tab switching. tab: a tab element, or a page's name ('dashboard',
      // 'products', …). A page reached from the admin's menu (data-menu)
      // marks the menu's tab active.
      function activateTab(tab) {
        const name = typeof tab === "string" ? tab : tab.dataset.tab;
        const content = document.getElementById("tab-" + name);
        if (!content) return;
        document.querySelectorAll(".tab-bar .tab").forEach((t) => {
          t.classList.toggle("active", t.dataset.tab === name || (t.dataset.menu || "").split(" ").includes(name));
        });
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
        content.classList.add("active");
        document.getElementById("month-bar-wrapper").classList.toggle("active", name === "dashboard");
        document.getElementById("home-hero-wrapper").classList.toggle("active", name === "dashboard");
      }
      document.querySelectorAll(".tab-bar .tab[data-tab]").forEach((tab) => {
        tab.addEventListener("click", () => activateTab(tab));
      });

      // The admin's menu tab: opens its list; picking one shows that page.
      document.querySelectorAll(".tab-menu").forEach((menu) => {
        menu.addEventListener("click", (e) => {
          const item = e.target.closest("[data-menu-tab]");
          if (item) {
            menu.classList.remove("open");
            activateTab(item.dataset.menuTab);
            return;
          }
          menu.classList.toggle("open");
        });
      });
      document.addEventListener("click", (e) => {
        document.querySelectorAll(".tab-menu.open").forEach((m) => {
          if (!m.contains(e.target)) m.classList.remove("open");
        });
      });

      // Switch to a tab by name, e.g. after a client moves there.
      function showTab(name) {
        activateTab(name);
      }

      // Drag a card onto a tab heading to move it into that stage.
      // Delegated on document (rather than queried once at load) since
      // cards are rendered dynamically by renderClientCards.
      let draggedCard = null;

      document.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".card-wrapper");
        if (!card) return;
        draggedCard = card;
        card.classList.add("dragging");
      });
      document.addEventListener("dragend", (e) => {
        const card = e.target.closest(".card-wrapper");
        if (!card) return;
        card.classList.remove("dragging");
        draggedCard = null;
      });

      function updateTabCount(tabContent) {
        if (!tabContent) return;
        const tab = document.querySelector('.tab[data-tab="' + tabContent.id.replace("tab-", "") + '"]');
        const countEl = tab && tab.querySelector(".tab-count");
        if (countEl) countEl.textContent = tabContent.querySelectorAll(".card-wrapper, .fa-wrapper, .pl-case").length;
      }

      // Keep the tab counts right when clients are added (e.g. at checkout).
      document.addEventListener("clients:changed", () => {
        document.querySelectorAll(".tab-content").forEach(updateTabCount);
      });

      document.querySelectorAll(".tab-bar .tab.fa-only").forEach((tab) => {
        tab.addEventListener("dragover", (e) => {
          if (!draggedCard) return;
          e.preventDefault();
          tab.classList.add("drag-over");
        });
        tab.addEventListener("dragleave", () => tab.classList.remove("drag-over"));
        tab.addEventListener("drop", (e) => {
          e.preventDefault();
          tab.classList.remove("drag-over");
          if (!draggedCard) return;
          const sourceTabContent = draggedCard.closest(".tab-content");
          const targetTabContent = document.getElementById("tab-" + tab.dataset.tab);
          if (!targetTabContent || sourceTabContent === targetTabContent) return;
          const card = draggedCard;
          const clientId = card.querySelector(".list-row").dataset.cardId;
          // A client with an open case belongs in Business; they can be
          // dragged there, but not out anywhere else until it's closed.
          if (tab.dataset.tab !== "business" && (getClientData(clientId)?.cases || []).some(isOpenCase)) {
            showChoiceDialog({
              title: "Open cases",
              message: "This client has open cases, please close the cases before moving them.",
              choices: [{ label: "OK", value: true, primary: true }],
            });
            return;
          }
          const sourceList = card.parentElement;
          // Move it straight away; put it back if the save fails.
          placeCardSorted(targetTabContent.querySelector('[id$="-cards"]'), card);
          updateTabCount(sourceTabContent);
          updateTabCount(targetTabContent);
          activateTab(tab);
          dbSetClientTab(clientId, tab.dataset.tab)
            .then(() => refreshDashboard())
            .catch((err) => {
              placeCardSorted(sourceList, card);
              updateTabCount(sourceTabContent);
              updateTabCount(targetTabContent);
              showSaveError(err);
            });
        });
      });
    </script>
  </body>
</html>
